(function () {
  // A tela de carregamento é honesta: a barra anda com os bytes que de fato chegaram (o mesmo
  // número que o motor do jogo usa) e, quando o download acaba, ela diz que está PREPARANDO
  // (ligando o jogo), sem fingir porcentagem.
  const $ = (id) => document.getElementById(id);
  const load = $('load'), fill = $('fill'), ceci = $('ceci'), lumi = $('lumi'), track = $('track');
  const TIPS = ['Segure PULAR para pular mais alto!', 'A Lumi ajuda: aperte PULAR de novo no ar.',
    'Ache as 3 Estrelas Reais de cada fase!', 'O cogumelo transforma a bebê em princesa.', 'Agachada, segure CORRER para engatinhar rápido.',
    'Pule em cima dos inimigos!', 'Nos checkpoints, a Cookie ou o Maurício vêm correndo ver a Ceci!', 'No bloco com a carinha do dragãozinho, monte nele!',
    'Na vila, os moradores têm pedidos para a Ceci.', 'Dá para jogar junto: chame um amigo!'];
  let tip = Math.floor(Math.random() * TIPS.length);
  const tipEl = $('tip');
  function nextTip() { tipEl.style.opacity = 0; setTimeout(() => { tipEl.textContent = 'Dica: ' + TIPS[tip]; tip = (tip + 1) % TIPS.length; tipEl.style.opacity = 1; }, 400); }
  nextTip();
  const tipTimer = setInterval(nextTip, 4500);
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    load.appendChild(s);
  }
  const coins = [];
  for (let i = 1; i <= 9; i++) {
    const c = document.createElement('div');
    c.className = 'coin';
    c.style.left = (i * 10) + '%';
    track.appendChild(c);
    coins.push({ el: c, at: i * 10, got: false });
  }
  const mb = (b) => (b / 1048576).toFixed(1).replace('.', ',');
  let shown = 0;
  function setProgress(p, cur, total) {
    p = Math.max(shown, Math.min(100, p));     // nunca volta para trás
    shown = p;
    fill.style.width = p + '%';
    ceci.style.left = p + '%';
    lumi.style.left = Math.min(100, p + 3) + '%';
    $('pct').textContent = Math.floor(p) + '%';
    if (total > 0) $('mb').textContent = mb(cur) + ' de ' + mb(total) + ' MB';
    coins.forEach((c) => { if (!c.got && p >= c.at) { c.got = true; c.el.classList.add('got'); } });
  }
  function preparing() {
    setProgress(100, 0, 0);
    ceci.classList.add('hop');
    $('sub').textContent = 'Preparando o reino...';
    $('pct').textContent = 'Quase lá!';
    $('mb').textContent = '';
  }
  function fail(err) {
    console.error(err);
    clearInterval(tipTimer);
    $('sub').textContent = 'Ops!';
    $('errmsg').textContent = 'Não deu para abrir o jogo. ' + (navigator.onLine === false ? 'Parece que está sem internet.' : 'Tente de novo daqui a pouquinho.');
    $('err').style.display = 'block';
    track.style.display = 'none'; $('pct').style.display = 'none'; $('mb').style.display = 'none'; tipEl.style.display = 'none';
  }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail(new Error('Navegador sem: ' + missing.join(', ')));
    $('errmsg').textContent = 'Este navegador é muito antigo para o jogo. Tente o Chrome, o Edge ou o Safari atualizados.';
    return;
  }
  engine.startGame({
    'onProgress': function (current, total) {
      if (total > 0) {
        if (current >= total) preparing();
        else setProgress(current / total * 100, current, total);
      }
    },
  }).then(() => {
    clearInterval(tipTimer);
    load.classList.add('done');
    setTimeout(() => load.remove(), 600);
  }, fail);
  // depois do download o motor ainda liga o jogo: se a barra já chegou ao fim, mostra "preparando"
  const watch = setInterval(() => { if (shown >= 99.9 && !ceci.classList.contains('hop')) preparing(); if (!document.body.contains(load)) clearInterval(watch); }, 300);
}());
</script>
</body>
</html>
